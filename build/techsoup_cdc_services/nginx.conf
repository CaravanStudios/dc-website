events {}

http {

  # --- Cloud Run: use real client IP from X-Forwarded-For ---
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Cloud Run traffic comes through Google frontends/proxies.
  # This allows nginx to trust X-Forwarded-For.
  # (Tighten this later if you front with an external HTTPS LB and restrict ingress.)
  set_real_ip_from 0.0.0.0/0;

  # 1) Block list by User-Agent (AI scrapers + generic bots)
  map $http_user_agent $block_bot {
    default 0;

    # ---- Allow Google ----
    ~*googlebot 0;
    ~*adsbot-google 0;
    ~*apis-google 0;

    # ---- Known AI / scraper bots (add/remove as you like) ----
    ~*gptbot 1;
    ~*oai-searchbot 1;
    ~*chatgpt-user 1;

    ~*claudebot 1;
    ~*claude-user 1;
    ~*claude-searchbot 1;

    ~*perplexitybot 1;
    ~*perplexity-user 1;

    ~*ccbot 1;           # Common Crawl
    ~*bytespider 1;      # ByteDance
    ~*youbot 1;          # You.com
    ~*amazonbot 1;

    # ---- Optional: block generic bots/crawlers/spiders ----
    # Comment these 3 lines out if you only want to block the explicit AI list above.
    ~*crawler 1;
    ~*spider 1;
    ~*bot 1;
  }

  server {
    listen 8080;

    # IP deny list (generated by run_nginx.sh)
    include /etc/nginx/blockips.d/*.conf;


    # 2) Enforce the block
    if ($block_bot) { return 403; }

    location / {
      proxy_pass http://0.0.0.0:7070;
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600;
    }

    location /core/api/ {
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 3600;

        # Respond with 204 No Content for OPTIONS requests
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }

      rewrite /core/api/(.*) /$1 break;
      proxy_pass http://localhost:8081;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600;

      # Add CORS headers to normal (non-OPTIONS) responses as well
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
    }

    location /mcp {
      proxy_pass http://localhost:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600;
      proxy_buffering off;
      proxy_cache off;
    }

    error_log /dev/stderr;
  }
}