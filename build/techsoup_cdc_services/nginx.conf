# Custom conf (-c) does not read /etc/nginx/modules-enabled, so load here.
load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;

events {}

http {

  # --- Cloud Run: use real client IP from X-Forwarded-For ---
  # Google front end appends the real client IP as the LAST entry.
  # Entries before it are written by the client and can be fake, so take
  # only the last one (recursive off). No load balancer in front.
  # If a load balancer is added, the last entry becomes the LB IP: revisit.
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  set_real_ip_from 0.0.0.0/0;

  # Newsletter rate limit per client IP (per Cloud Run instance).
  limit_req_zone $binary_remote_addr zone=newsletter:1m rate=5r/m;
  limit_req_status 429;

  # --- Country block: allow only US, GB, EU, EEA, CH ---
  # Country from $remote_addr (real client IP, after realip above).
  # DB-IP Lite DB, see Dockerfile.
  geoip2 /workspace/geoip/dbip-country-lite.mmdb {
    $geoip2_country_code country iso_code;
  }

  map $geoip2_country_code $allowed_country {
    default 0;
    ""  1;   # no country: private / internal IP (Cloud Run probes) or unknown

    US 1;
    GB 1;
    # EU
    AT 1; BE 1; BG 1; HR 1; CY 1; CZ 1; DK 1; EE 1; FI 1;
    FR 1; DE 1; GR 1; HU 1; IE 1; IT 1; LV 1; LT 1; LU 1;
    MT 1; NL 1; PL 1; PT 1; RO 1; SK 1; SI 1; ES 1; SE 1;
    # EEA (not EU) + Switzerland
    IS 1; LI 1; NO 1; CH 1;
  }

  log_format realip '$remote_addr country=$geoip2_country_code '
                    'xff="$http_x_forwarded_for" "$request" $status';

  # 1) Block list by User-Agent (AI scrapers + generic bots)
  map $http_user_agent $block_bot {
    default 0;

    # ---- Allow Google ----
    ~*googlebot 0;
    ~*adsbot-google 0;
    ~*apis-google 0;

    # ---- Allow Bing ----
    ~*bingbot 0;

    # ---- Known AI / scraper bots (add/remove as you like) ----
    ~*gptbot 1;
    ~*oai-searchbot 1;
    ~*chatgpt-user 1;

    ~*claudebot 1;
    ~*claude-user 1;
    ~*claude-searchbot 1;

    ~*perplexitybot 1;
    ~*perplexity-user 1;

    ~*ccbot 1;           # Common Crawl
    ~*bytespider 1;      # ByteDance
    ~*youbot 1;          # You.com
    ~*amazonbot 1;

    # AI agents not caught by generic bot/spider/crawler rules below
    ~*meta-external 1;   # Meta AI (agent + fetcher)
    ~*anthropic-ai 1;
    ~*claude-web 1;
    ~*cohere-ai 1;
    ~*mistralai-user 1;
    ~*gemini-deep-research 1;
    ~*googleother 1;
    ~*yandexadditional 1;
    ~*omgili 1;          # Webz.io
    ~*img2dataset 1;
    ~*scrapy 1;

    # ---- Optional: block generic bots/crawlers/spiders ----
    # Comment these 3 lines out if you only want to block the explicit AI list above.
    ~*crawler 1;
    ~*spider 1;
    ~*bot 1;
  }

  server {
    listen 8080;

    # IP deny list (generated by run_nginx.sh)
    include /etc/nginx/blockips.d/*.conf;


    # 2) Enforce the block
    if ($block_bot) { return 403; }

    # 3) Country block
    if ($allowed_country = 0) { rewrite ^ /__country_blocked last; }

    location = /__country_blocked {
      internal;
      default_type text/html;
      return 403 '<!doctype html><html><head><meta charset="utf-8"><title>Not available</title></head><body><p>This site is not available in your country.</p><p><small><a href="https://db-ip.com">IP Geolocation by DB-IP</a></small></p></body></html>';
    }

    location / {
      proxy_pass http://0.0.0.0:7070;
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600;
    }

    location /api/newsletter/ {
      limit_req zone=newsletter burst=3 nodelay;
      access_log /dev/stdout realip;
      proxy_pass http://0.0.0.0:7070;
      proxy_set_header Host $http_host;
    }

    location /core/api/ {
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 3600;

        # Respond with 204 No Content for OPTIONS requests
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }

      rewrite /core/api/(.*) /$1 break;
      proxy_pass http://localhost:8081;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600;

      # Add CORS headers to normal (non-OPTIONS) responses as well
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
    }

    location /mcp {
      proxy_pass http://localhost:8082;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600;
      proxy_buffering off;
      proxy_cache off;
    }

    error_log /dev/stderr;
  }
}