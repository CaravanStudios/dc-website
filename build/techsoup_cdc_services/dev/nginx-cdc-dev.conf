events {}

http {
  # Newsletter rate limit per client IP.
  limit_req_zone $binary_remote_addr zone=newsletter:1m rate=5r/m;
  limit_req_status 429;

  # 1) Block list by User-Agent (AI scrapers + generic bots)
  map $http_user_agent $block_bot {
    default 0;

    # ---- Allow Google ----
    ~*googlebot 0;
    ~*adsbot-google 0;
    ~*apis-google 0;

    # ---- Allow Bing ----
    ~*bingbot 0;

    # ---- Known AI / scraper bots (add/remove as you like) ----
    ~*gptbot 1;
    ~*oai-searchbot 1;
    ~*chatgpt-user 1;

    ~*claudebot 1;
    ~*claude-user 1;
    ~*claude-searchbot 1;

    ~*perplexitybot 1;
    ~*perplexity-user 1;

    ~*ccbot 1;           # Common Crawl
    ~*bytespider 1;      # ByteDance
    ~*youbot 1;          # You.com
    ~*amazonbot 1;

    # AI agents not caught by generic bot/spider/crawler rules below
    ~*meta-external 1;   # Meta AI (agent + fetcher)
    ~*anthropic-ai 1;
    ~*claude-web 1;
    ~*cohere-ai 1;
    ~*mistralai-user 1;
    ~*gemini-deep-research 1;
    ~*googleother 1;
    ~*yandexadditional 1;
    ~*omgili 1;          # Webz.io
    ~*img2dataset 1;
    ~*scrapy 1;

    # ---- Optional: block generic bots/crawlers/spiders ----
    # Comment these 3 lines out if you only want to block the explicit AI list above.
    ~*crawler 1;
    ~*spider 1;
    ~*bot 1;
  }

  server {
    listen 8080;

    include /etc/nginx/blockips.d/*.conf;

    # 2) Enforce the block
    if ($block_bot) { return 403; }

    # Forward to flask website
    location / {
        proxy_pass http://dc-website:7070;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600;
    }

    location /api/newsletter/ {
        limit_req zone=newsletter burst=3 nodelay;
        proxy_pass http://dc-website:7070;
        proxy_set_header Host $http_host;
    }

    # Forward to mixer
    location /core/api/ {
        rewrite /core/api/(.*) /$1 break;
        proxy_pass http://dc-mixer:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600;
    }
    error_log /dev/stderr;
  }
}